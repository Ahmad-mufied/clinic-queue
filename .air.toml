# .air.toml
# Live reload configuration for Go backend (cmd/api)

root = "."
tmp_dir = "tmp"

[build]
  cmd = "go build -o ./tmp/main ./cmd/api"
  bin = "./tmp/main"
  full_bin = "./tmp/main"
  include_ext = ["go", "conf", "csv", "sql", "env"]
  exclude_dir = ["web", "tmp", "docs", ".git", ".agents", "scripts", ".idea", ".qodo"]
  exclude_file = ["coverage.out", "coverage.html"]
  include_dir = ["cmd", "internal", "config", "migrations"]
  exclude_regex = ["_test\\.go"]
  delay = 500
  stop_on_error = true
  send_interrupt = true
  kill_delay = 500

[log]
  time = true

[color]
  main = "magenta"
  watcher = "cyan"
  build = "yellow"
  runner = "green"

[misc]
  clean_on_exit = true
